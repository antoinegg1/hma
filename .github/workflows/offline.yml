name: Offline reproduction checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-repro.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m hma.repro.cli doctor --config configs/local.json --offline
      - run: python -m hma.repro.cli plan --suite paper
      - run: python -m pip install build ruff
      - run: ruff check src/hma tests
      - run: ruff format --check src/hma tests
      - run: python -m build --wheel
