[project]
name = "hma"
version = "0.1.0"
description = "The submit3-minimal Flame Chase controller, with the humanize agent runtime vendored alongside it"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# hmz is vendored under src/ rather than declared as a dependency, so the
# controller and the runtime it was measured against stay pinned together.
# Its own third-party requirements are reproduced here.
dependencies = [
    "dateparser>=1.4.2",
    "deepseek-harness-sdk>=0.1.1rc1,<0.2",
    "docker>=7",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pyfiglet>=1.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.32",
    "rich>=15",
    "sentry-sdk>=2.68.1",
    "textual>=8.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmz"]
