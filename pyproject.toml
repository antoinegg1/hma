[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "hma"
version = "1.0.0"
description = "HMA: capped alternation of native agents for long-horizon machine learning engineering"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "src/hma/benchmark/LICENSE"]
dependencies = ["docker>=7.2.0,<8", "pydantic>=2.13.5,<3", "requests>=2.34.2,<3", "pyyaml>=6", "python-dotenv>=1.2.4", "matplotlib>=3.11.2", "uv==0.12.22"]

[project.optional-dependencies]
runtime = ["dateparser>=1.4.3", "deepseek-harness-sdk>=0.1.5rc1,<0.2", "psutil>=7.2.2", "pyfiglet>=1.0.4", "python-dotenv>=1.2.4", "pyyaml>=6.0.3", "rich>=15", "sentry-sdk>=2.71.0", "textual>=8.2.8"]
test = ["pytest>=9.1.1,<10"]
evaluation = ["pandas>=3.0.6", "pyyaml>=6"]

[project.scripts]
hma-run = "hma.supervisor:main"
hmz = "hmz.__main__:main"
hma-stage-evaluator = "hma.benchmark.stage:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hma", "src/hmz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"baselines/harness16" = "hma/repro/assets/harness16"

[tool.ruff]
line-length = 100
extend-exclude = ["src/hmz", "baselines", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
